name: 编译京东云亚瑟AX1800 Pro iStoreOS
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'istoreos-23.05'
        type: choice
        options:
          - istoreos-23.05
          - istoreos-24.10
      build_type:
        description: '编译类型'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - minimal

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl python3-pip libelf-dev ccache

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成京东云亚瑟配置文件
        run: |
          cat > .config << EOF
          CONFIG_TARGET_ipq60xx=y
          CONFIG_TARGET_ipq60xx_generic=y
          CONFIG_TARGET_ipq60xx_generic_DEVICE_jdcloud_re-ss-01=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          
          # iStoreOS 核心组件
          CONFIG_PACKAGE_luci-app-istore=y
          CONFIG_PACKAGE_luci-app-istorex=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          
          # Docker 支持（解决 operation not supported 错误）
          CONFIG_PACKAGE_kmod-docker=y
          CONFIG_PACKAGE_kmod-overlay=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          
          # WireGuard VPN 完整支持
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          
          # 基础网络组件
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ddns=y
          
          # 取消不需要的组件，加快编译
          # CONFIG_PACKAGE_luci-app-adguardhome=n
          # CONFIG_PACKAGE_luci-app-openclash=n
          EOF
          
          # 自动补全所有默认配置
          make defconfig
          
      - name: 预下载源码包
        run: make download -j8 V=s

      - name: 开始编译
        run: make -j$(nproc) V=s

      - name: 整理固件文件
        run: |
          mkdir -p output
          cp bin/targets/ipq60xx/generic/istoreos-*-ipq60xx-jdcloud_re-ss-01-squashfs-*.bin output/
          cd output
          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')" > build_info.txt
          echo "分支: ${{ inputs.branch }}" >> build_info.txt
          echo "设备: 京东云亚瑟AX1800 Pro (RE-SS-01)" >> build_info.txt

      - name: 上传固件到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jdcloud-ax1800pro-${{ inputs.branch }}-${{ github.run_number }}
          name: 京东云亚瑟AX1800 Pro iStoreOS 固件
          files: output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
