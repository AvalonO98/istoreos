name: 编译京东云亚瑟AX1800 Pro iStoreOS
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'istoreos-23.05'
        type: choice
        options:
          - istoreos-23.05
          - istoreos-24.10
      build_type:
        description: '编译类型'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - minimal
  repository_dispatch:
    types: [sync-completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 开启详细编译日志
  V: s

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 确定编译参数
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> $GITHUB_OUTPUT
            echo "build_type=${{ github.event.client_payload.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ inputs.branch }}" >> $GITHUB_OUTPUT
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          fi

      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.params.outputs.branch }}
          fetch-depth: 0

      - name: 检查系统资源
        run: |
          echo "=== CPU 信息 ==="
          lscpu | grep -E 'CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket'
          echo "=== 内存信息 ==="
          free -h
          echo "=== 磁盘信息 ==="
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl python3-pip libelf-dev ccache

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 验证配置文件
        run: |
          cat > .config << EOF
          CONFIG_TARGET_ipq60xx=y
          CONFIG_TARGET_ipq60xx_generic=y
          CONFIG_TARGET_ipq60xx_generic_DEVICE_jdcloud_re-ss-01=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          
          # iStoreOS 核心组件
          CONFIG_PACKAGE_luci-app-istore=y
          CONFIG_PACKAGE_luci-app-istorex=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          
          # Docker 支持
          CONFIG_PACKAGE_kmod-docker=y
          CONFIG_PACKAGE_kmod-overlay=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-ipt-extra=y
          
          # WireGuard VPN 完整支持
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          
          # 基础网络组件
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ddns=y
          EOF
          
          # 验证配置并补全默认值
          make defconfig
          
          # 检查目标设备是否正确配置
          echo "=== 目标设备配置 ==="
          grep -E 'CONFIG_TARGET_ipq60xx|CONFIG_TARGET.*DEVICE_jdcloud' .config

      - name: 预下载所有源码包
        run: |
          make download -j8
          # 检查是否有下载失败的包
          if [ $? -ne 0 ]; then
            echo "❌ 源码包下载失败，正在重试..."
            make download -j4
          fi

      - name: 开始编译（单线程，避免内存不足）
        run: |
          # 先使用单线程编译，避免GitHub Actions内存不足导致失败
          make -j1 V=s
          
          # 检查编译是否成功
          if [ $? -ne 0 ]; then
            echo "❌ 编译失败！"
            exit 1
          fi

      - name: 检查生成的固件文件
        run: |
          echo "=== 所有生成的目标文件 ==="
          find bin/ -type f -name "*.bin"
          
          # 检查是否有亚瑟的固件
          if [ -z "$(find bin/ -name "*jdcloud_re-ss-01*squashfs*.bin")" ]; then
            echo "❌ 没有找到京东云亚瑟的固件文件！"
            exit 1
          fi

      - name: 整理固件文件
        run: |
          mkdir -p output
          
          # 复制所有亚瑟的固件文件
          find bin/ -name "*jdcloud_re-ss-01*squashfs*.bin" -exec cp {} output/ \;
          
          cd output
          echo "编译完成时间: $(date '+%Y-%m-%d %H:%M:%S')" > build_info.txt
          echo "分支: ${{ steps.params.outputs.branch }}" >> build_info.txt
          echo "设备: 京东云亚瑟AX1800 Pro (RE-SS-01)" >> build_info.txt
          echo "编译类型: ${{ steps.params.outputs.build_type }}" >> build_info.txt
          
          echo "=== 最终生成的固件文件 ==="
          ls -la

      - name: 上传固件到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: jdcloud-ax1800pro-${{ steps.params.outputs.branch }}-${{ github.run_number }}
          name: 京东云亚瑟AX1800 Pro iStoreOS 固件
          files: output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
